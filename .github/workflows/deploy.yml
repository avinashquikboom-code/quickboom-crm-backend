name: Build & Deploy (ECR → EC2)

# Auto-trigger: every push to main runs build + deploy.
# (Also manually runnable from the Actions tab.)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never let two deploys run at once; cancel an in-flight one on a newer push.
  group: deploy-production
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  # Must match API_ECR_REPOSITORY in deploy/docker/config.sh on the server.
  ECR_REPOSITORY: qcrm-admin-backend
  # Path on the server where deploy/docker/ was copied by hand (see deploy/README.md).
  DEPLOY_DIR: /var/www/qbapp.online

jobs:
  build-and-deploy:
    name: Build image, push to ECR, deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- AWS / ECR auth ---------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ---- Build & push image ----------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: meta
        run: |
          SHA_TAG="${GITHUB_SHA::12}"
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_sha=${REGISTRY}/${ECR_REPOSITORY}:${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${REGISTRY}/${ECR_REPOSITORY}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image_sha }}
            ${{ steps.meta.outputs.image_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Deploy over SSH --------------------------------------------------
      # Rewrite the API_IMAGE_TAG line in the server's already-present
      # config.sh (deploy/ is copied there by hand, not synced by CI — see
      # deploy/README.md), then run backend.sh — ONLY the API container.
      # admin.sh (admin panel) is untouched by this workflow.
      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pin image tag and deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "set -e
             cd '${DEPLOY_DIR}'

             # ── 1. Update the pinned image tag in config.sh ──────────────────
             chmod +x ./*.sh
             sed -i 's|^export API_IMAGE_TAG=.*|export API_IMAGE_TAG=\"${{ steps.meta.outputs.sha_tag }}\"|' config.sh
             source ./config.sh

             # ── 2. Resolve any P3009-blocked failed migrations ──────────────
             # Idempotent: if no failed migrations exist this is a harmless no-op.
             # Runs inside a disposable container using the freshly-pulled image
             # so Prisma version and schema are always in sync with the binary.
             echo '[quikboom] Resolving any failed Prisma migrations (P3009 guard)...'
             docker run --rm \
               --network host \
               -e DATABASE_URL=\"\${DATABASE_URL}\" \
               \${API_ECR_REGISTRY}/\${API_ECR_REPOSITORY}:\${{ steps.meta.outputs.sha_tag }} \
               sh -c '
                 STATUS=\$(npx prisma migrate status 2>&1)
                 echo \"\$STATUS\"
                 # Extract all failed migration names and resolve each one
                 FAILED=\$(echo \"\$STATUS\" | grep -oP \"(?<=The \`)[^`]+(?=\` migration started)\" || true)
                 if [ -n \"\$FAILED\" ]; then
                   echo \"[quikboom] Found failed migration(s): \$FAILED\"
                   for MIGRATION in \$FAILED; do
                     echo \"[quikboom] Resolving --rolled-back: \$MIGRATION\"
                     npx prisma migrate resolve --rolled-back \"\$MIGRATION\"
                   done
                 else
                   echo \"[quikboom] No failed migrations found — continuing.\"
                 fi
               '

             # ── 3. Run normal deploy (pulls image, runs migrate deploy, restarts container) ──
             ./backend.sh"

      - name: Deploy summary
        if: always()
        run: |
          echo "### Deploy result" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ steps.meta.outputs.image_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA::12}\`" >> "$GITHUB_STEP_SUMMARY"
