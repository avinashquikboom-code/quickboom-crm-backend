name: Build & Deploy (ECR → EC2)

# Auto-deploy: every push to the `production` branch builds the image and deploys the API.
# main does not deploy: the copy of this file on main only builds, because main's database
# migrations do not apply to the live database yet.
# (Also manually runnable from the Actions tab.)
on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  # Never let two deploys run at once; cancel an in-flight one on a newer push.
  group: deploy-production
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  # Must match API_ECR_REPOSITORY in deploy/docker/config.sh on the server.
  ECR_REPOSITORY: qcrm-admin-backend
  # Server folder with the deploy scripts (symlink to /var/www/qbapp/deploy; see /var/www/qbapp/README.md).
  DEPLOY_DIR: /var/www/qbapp.online
  # The container this workflow deploys and checks.
  API_CONTAINER: quikboom-api

jobs:
  build-and-deploy:
    name: Build image, push to ECR, deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- AWS / ECR auth ---------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ---- Build & push image ----------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: meta
        run: |
          SHA_TAG="${GITHUB_SHA::12}"
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_sha=${REGISTRY}/${ECR_REPOSITORY}:${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${REGISTRY}/${ECR_REPOSITORY}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image_sha }}
            ${{ steps.meta.outputs.image_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Deploy over SSH --------------------------------------------------
      # On the server, `./deploy.sh backend` pulls this commit's image, applies the
      # database migrations and restarts ONLY the API container. Then this step checks
      # that the container really runs this image and is healthy, and fails otherwise,
      # so a green run means "deployed". The admin panel (admin.sh) is not touched.
      # The server has its own AWS login for ECR; no AWS keys are sent.
      # EXPECT_ECR_REGISTRY: the server refuses to deploy if its config.sh pulls from a
      # different registry than the one this workflow just pushed to.
      - name: Deploy API container on EC2
        timeout-minutes: 15
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          IMAGE_TAG: ${{ steps.meta.outputs.sha_tag }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          HOST="$(printf '%s' "$EC2_HOST" | tr -d '[:space:]')"
          SSH_USER="$(printf '%s' "$EC2_USER" | tr -d '[:space:]')"
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
            "$SSH_USER@$HOST" "DEPLOY_DIR='$DEPLOY_DIR' CONTAINER='$API_CONTAINER' IMAGE_TAG='$IMAGE_TAG' EXPECT_ECR_REGISTRY='$ECR_REGISTRY' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_DIR"
          chmod +x ./*.sh
          IMAGE_TAG="$IMAGE_TAG" EXPECT_ECR_REGISTRY="$EXPECT_ECR_REGISTRY" ./deploy.sh backend </dev/null
          for _ in $(seq 1 30); do
            image="$(docker inspect -f '{{.Config.Image}}' "$CONTAINER" 2>/dev/null || true)"
            state="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER" 2>/dev/null || true)"
            if [ "${image##*:}" = "$IMAGE_TAG" ] && { [ "$state" = healthy ] || [ "$state" = running ]; }; then
              echo "OK: $CONTAINER runs $image ($state)"; exit 0
            fi
            sleep 5
          done
          echo "FAILED: $CONTAINER is '$image' ($state), expected tag $IMAGE_TAG" >&2
          docker logs --tail 40 "$CONTAINER" >&2 || true
          exit 1
          REMOTE

      - name: Deploy summary
        if: always()
        run: |
          echo "### Deploy result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ steps.meta.outputs.image_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA::12}\`" >> "$GITHUB_STEP_SUMMARY"
