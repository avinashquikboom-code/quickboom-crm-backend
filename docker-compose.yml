version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: quikboom_postgres
    restart: always
    environment:
      POSTGRES_USER: quikboom_user
      POSTGRES_PASSWORD: quikboom_pass
      POSTGRES_DB: quikboom_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: quikboom_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quikboom_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://quikboom_user:quikboom_pass@postgres:5432/quikboom_crm?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: "quikboom_super_secret_jwt_access_key_2026"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
